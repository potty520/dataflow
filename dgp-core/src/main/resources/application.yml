server:
  port: 8082
  tomcat:
    threads:
      max: 400
    accept-count: 1000
    max-connections: 10000
    keep-alive-timeout: 60s
    connection-timeout: 30s

spring:
  application:
    name: dgp-core
  datasource:
    driver-class-name: org.h2.Driver
    # 与 dgp-auth 共用同一 H2 文件；可用 DGP_H2_FILE 覆盖为绝对路径
    url: jdbc:h2:file:${DGP_H2_FILE:../data/dgp};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 10000
      connection-init-sql: "SET QUERY_TIMEOUT 60000"
  data:
    redis:
      host: ${DGP_REDIS_HOST:127.0.0.1}
      port: ${DGP_REDIS_PORT:6379}
      password: ${DGP_REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${DGP_NACOS_ADDR:127.0.0.1:8848}
        enabled: ${DGP_NACOS_ENABLED:false}
      config:
        enabled: ${DGP_NACOS_ENABLED:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 50MB

dgp:
  mask-key: "${DGP_MASK_KEY:dgp-mask-key-2026}"
  seed-demo-data: ${DGP_SEED_DEMO:true}
  platform-version: "1.0.0"
  gateway-hmac-secret: ${DGP_GATEWAY_HMAC_SECRET:dev-gateway-hmac-change-me}
  scheduler-token: ${DGP_SCHEDULER_TOKEN:dev-scheduler-token-change-me}
  # 启用 dgp-scheduler 后请设为 false，避免双重调度
  local-scheduler:
    enabled: ${DGP_LOCAL_SCHEDULER:true}
  redis:
    enabled: ${DGP_REDIS_ENABLED:false}
  tenant:
    strict: ${DGP_TENANT_STRICT:true}
  datasource:
    allow-private-probe: true
  job:
    statement-timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.dgp: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{traceId}] %logger{20} - %msg%n"
