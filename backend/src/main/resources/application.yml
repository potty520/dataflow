server:
  port: 8080
  tomcat:
    threads:
      # 并发调优：工作线程 400、排队 1000；配合鉴权缓存后单请求基本不再查库
      max: 400
    accept-count: 1000
    max-connections: 10000
    keep-alive-timeout: 60s
    connection-timeout: 30s

spring:
  application:
    name: dgp-boot
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/dgp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 10000
      # 单条语句 60s 超时（H2 语法）；防止长查询长期占用调度线程
      connection-init-sql: "SET QUERY_TIMEOUT 60000"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 50MB

dgp:
  # 生产必须通过环境变量 DGP_JWT_SECRET 注入（>=32 字节），默认值仅用于本地演示
  jwt-secret: "${DGP_JWT_SECRET:dev-only-change-me-dgp-governance-platform-secret-key-2026}"
  token-minutes: 30          # access token 30 分钟，配合前端静默刷新
  refresh-days: 7            # refresh token 7 天
  # 脱敏加密密钥（任意长度，内部经 SHA-256 派生为 32 字节 AES 密钥）
  mask-key: "${DGP_MASK_KEY:dgp-mask-key-2026}"
  seed-demo-data: true
  platform-version: "1.0.0"
  cors:
    allowed-origins: "${DGP_CORS_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}"
  datasource:
    # 数据源连通性探测是否允许访问私网/回环地址（私有化部署通常为私网，按需收紧）
    allow-private-probe: true
  job:
    # 单条 SQL 执行超时（秒），避免长查询占用调度线程
    statement-timeout-seconds: 60

logging:
  level:
    root: INFO
    com.dgp: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{traceId}] %logger{20} - %msg%n"
