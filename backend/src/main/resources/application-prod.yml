# 生产/信创 profile：切换 PostgreSQL / 达梦 / Kingbase 时改此处
# 启动：java -jar dgp-boot.jar --spring.profiles.active=prod
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DGP_DB_HOST:127.0.0.1}:${DGP_DB_PORT:5432}/${DGP_DB_NAME:dgp}
    username: ${DGP_DB_USER:dgp}
    password: ${DGP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 8
      connection-timeout: 10000
      # 单条语句 60s 超时，避免长查询占满调度线程
      connection-init-sql: "SET statement_timeout = 60000"
  sql:
    init:
      mode: never          # 生产由 Flyway/Liquibase 管理版本，禁止启动时执行 DDL

dgp:
  # 生产必须显式注入，禁止沿用开发默认密钥（缺失时启动会直接失败）
  jwt-secret: "${DGP_JWT_SECRET}"
  mask-key: "${DGP_MASK_KEY}"
  seed-demo-data: false    # 生产不装载演示数据
  cors:
    allowed-origins: "${DGP_CORS_ORIGINS:http://127.0.0.1:8080}"
  datasource:
    allow-private-probe: false

logging:
  level:
    root: INFO
    com.dgp: INFO
