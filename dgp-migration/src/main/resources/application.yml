server:
  port: 8088

spring:
  application:
    name: dgp-migration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${DGP_H2_FILE:../data/dgp};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  cloud:
    nacos:
      discovery:
        server-addr: ${DGP_NACOS_ADDR:127.0.0.1:8848}
        enabled: ${DGP_NACOS_ENABLED:false}
      config:
        enabled: ${DGP_NACOS_ENABLED:false}
  flyway:
    enabled: false
  sql:
    init:
      mode: never

dgp:
  gateway-hmac-secret: ${DGP_GATEWAY_HMAC_SECRET:dev-gateway-hmac-change-me}
  scheduler-token: ${DGP_SCHEDULER_TOKEN:dev-scheduler-token-change-me}
  mask-key: "${DGP_MASK_KEY:dgp-mask-key-2026}"
  tenant:
    strict: ${DGP_TENANT_STRICT:true}
  datasource:
    allow-private-probe: ${DGP_ALLOW_PRIVATE_PROBE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.dgp.migration: INFO
