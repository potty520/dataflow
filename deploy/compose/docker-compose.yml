# DGP 微服务底座：基础设施 + 应用（本地/演示）
# 用法：
#   cd deploy/compose
#   docker compose up -d redis nacos mysql prometheus grafana
#   # 应用 jar 构建后：
#   docker compose up -d gateway auth core

services:
  mysql:
    image: mysql:8.0
    container_name: dgp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dgp_root}
      MYSQL_DATABASE: dgp
      MYSQL_USER: dgp
      MYSQL_PASSWORD: ${DGP_DB_PASSWORD:-dgp_pass}
    ports:
      - "3306:3306"
    volumes:
      - dgp_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci", "--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-dgp_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dgp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: dgp-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/"]
      interval: 15s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dgp-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dgp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  auth:
    image: eclipse-temurin:17-jre
    container_name: dgp-auth
    working_dir: /app
    volumes:
      - ../../dgp-auth/target/dgp-auth.jar:/app/app.jar:ro
      - dgp_auth_data:/app/data
    environment:
      DGP_REDIS_ENABLED: "true"
      DGP_REDIS_HOST: redis
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  core:
    image: eclipse-temurin:17-jre
    container_name: dgp-core
    working_dir: /app
    volumes:
      - ../../dgp-core/target/dgp-core.jar:/app/app.jar:ro
      - dgp_core_data:/app/data
    environment:
      DGP_SEED_DEMO: "true"
      DGP_REDIS_ENABLED: "true"
      DGP_REDIS_HOST: redis
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_MASK_KEY: ${DGP_MASK_KEY:-dgp-mask-key-2026}
      DGP_TENANT_STRICT: "true"
      DGP_LOCAL_SCHEDULER: "false"
      DGP_SCHEDULER_TOKEN: ${DGP_SCHEDULER_TOKEN:-dev-scheduler-token-change-me}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy

  metadata:
    image: eclipse-temurin:17-jre
    container_name: dgp-metadata
    working_dir: /app
    volumes:
      - ../../dgp-metadata/target/dgp-metadata.jar:/app/app.jar:ro
      - dgp_core_data:/app/data
    environment:
      DGP_H2_FILE: /app/data/dgp
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_SCHEDULER_TOKEN: ${DGP_SCHEDULER_TOKEN:-dev-scheduler-token-change-me}
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_TENANT_STRICT: "true"
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8083:8083"
    depends_on:
      - core

  quality:
    image: eclipse-temurin:17-jre
    container_name: dgp-quality
    working_dir: /app
    volumes:
      - ../../dgp-quality/target/dgp-quality.jar:/app/app.jar:ro
      - dgp_core_data:/app/data
    environment:
      DGP_H2_FILE: /app/data/dgp
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_MASK_KEY: ${DGP_MASK_KEY:-dgp-mask-key-2026}
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_TENANT_STRICT: "true"
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8087:8087"
    depends_on:
      - core

  migration:
    image: eclipse-temurin:17-jre
    container_name: dgp-migration
    working_dir: /app
    volumes:
      - ../../dgp-migration/target/dgp-migration.jar:/app/app.jar:ro
      - dgp_core_data:/app/data
    environment:
      DGP_H2_FILE: /app/data/dgp
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_MASK_KEY: ${DGP_MASK_KEY:-dgp-mask-key-2026}
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_TENANT_STRICT: "true"
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8088:8088"
    depends_on:
      - core

  scheduler:
    image: eclipse-temurin:17-jre
    container_name: dgp-scheduler
    working_dir: /app
    volumes:
      - ../../dgp-scheduler/target/dgp-scheduler.jar:/app/app.jar:ro
    environment:
      DGP_CORE_URI: http://core:8082
      DGP_SCHEDULER_TOKEN: ${DGP_SCHEDULER_TOKEN:-dev-scheduler-token-change-me}
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_SCHEDULER_ENGINE: ${DGP_SCHEDULER_ENGINE:-local}
      DGP_XXL_ENABLED: ${DGP_XXL_ENABLED:-false}
      XXL_JOB_ADMIN: ${XXL_JOB_ADMIN:-http://xxl-job-admin:8080/xxl-job-admin}
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8086:8086"
      - "9999:9999"
    depends_on:
      - core

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: dgp-xxl-job-admin
    profiles: ["xxl"]
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-dgp_root}
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy

  security:
    image: eclipse-temurin:17-jre
    container_name: dgp-security
    working_dir: /app
    volumes:
      - ../../dgp-security/target/dgp-security.jar:/app/app.jar:ro
      - dgp_core_data:/app/data
    environment:
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_H2_FILE: /app/data/dgp
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8084:8084"
    depends_on:
      - core

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: dgp-es
    profiles: ["es"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - dgp_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  search:
    image: eclipse-temurin:17-jre
    container_name: dgp-search
    working_dir: /app
    volumes:
      - ../../dgp-search/target/dgp-search.jar:/app/app.jar:ro
      - dgp_core_data:/app/data
    environment:
      DGP_H2_FILE: /app/data/dgp
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_ES_ENABLED: ${DGP_ES_ENABLED:-false}
      DGP_ES_URIS: ${DGP_ES_URIS:-http://elasticsearch:9200}
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8085:8085"
    depends_on:
      - core

  gateway:
    image: eclipse-temurin:17-jre
    container_name: dgp-gateway
    working_dir: /app
    volumes:
      - ../../dgp-gateway/target/dgp-gateway.jar:/app/app.jar:ro
    environment:
      DGP_REDIS_HOST: redis
      DGP_NACOS_ENABLED: "true"
      DGP_NACOS_ADDR: nacos:8848
      DGP_AUTH_URI: http://auth:8081
      DGP_CORE_URI: http://core:8082
      DGP_METADATA_URI: http://metadata:8083
      DGP_QUALITY_URI: http://quality:8087
      DGP_MIGRATION_URI: http://migration:8088
      DGP_SECURITY_URI: http://security:8084
      DGP_SCHEDULER_URI: http://scheduler:8086
      DGP_SEARCH_URI: http://search:8085
      DGP_JWKS_URL: http://auth:8081/api/v1/auth/jwks
      DGP_GATEWAY_HMAC_SECRET: ${DGP_GATEWAY_HMAC_SECRET:-dev-gateway-hmac-change-me}
      DGP_CORS_ORIGINS: ${DGP_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - core
      - metadata
      - quality
      - migration
      - security
      - scheduler
      - search
      - redis

volumes:
  dgp_mysql:
  dgp_auth_data:
  dgp_core_data:
  dgp_es:
