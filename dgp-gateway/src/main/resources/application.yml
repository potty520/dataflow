server:
  port: 8080

spring:
  application:
    name: dgp-gateway
  data:
    redis:
      host: ${DGP_REDIS_HOST:127.0.0.1}
      port: ${DGP_REDIS_PORT:6379}
      password: ${DGP_REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${DGP_NACOS_ADDR:127.0.0.1:8848}
        enabled: ${DGP_NACOS_ENABLED:false}
      config:
        enabled: ${DGP_NACOS_ENABLED:false}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: dgp-auth
          uri: ${DGP_AUTH_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: dgp-search
          uri: ${DGP_SEARCH_URI:http://127.0.0.1:8085}
          predicates:
            - Path=/api/v1/search/**
        - id: dgp-scheduler
          uri: ${DGP_SCHEDULER_URI:http://127.0.0.1:8086}
          predicates:
            - Path=/api/v1/scheduler/**
        - id: dgp-security
          uri: ${DGP_SECURITY_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/security/audit/chain,/api/v1/security/audit/verify,/api/v1/security/audit/verify-chain
        - id: dgp-metadata
          uri: ${DGP_METADATA_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/metadata/**
        - id: dgp-quality
          uri: ${DGP_QUALITY_URI:http://127.0.0.1:8087}
          predicates:
            - Path=/api/v1/quality/**
        - id: dgp-migration
          uri: ${DGP_MIGRATION_URI:http://127.0.0.1:8088}
          predicates:
            - Path=/api/v1/migration/**
        - id: dgp-core
          uri: ${DGP_CORE_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/**,/open/**

dgp:
  gateway-hmac-secret: ${DGP_GATEWAY_HMAC_SECRET:dev-gateway-hmac-change-me}
  tenant-rate-limit-per-minute: ${DGP_TENANT_RPM:600}
  jwks-url: ${DGP_JWKS_URL:http://127.0.0.1:8081/api/v1/auth/jwks}
  cors:
    allowed-origins: ${DGP_CORS_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.dgp.gateway: INFO
